name: Live LLM Qualification

on:
  workflow_dispatch:
    inputs:
      provider:
        description: Provider to qualify
        required: true
        default: all
        type: choice
        options:
          - all
          - openai
          - anthropic
          - google
          - grok
          - meta
          - openrouter
      mode:
        description: Qualification depth
        required: true
        default: catalog
        type: choice
        options:
          - catalog
          - canary
          - selected
          - full
  schedule:
    - cron: "19 4 * * 3" # Wednesday catalog inventory, or selected after rollout approval.

permissions:
  contents: read

jobs:
  prepare:
    name: Prepare live matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.matrix.outputs.mode }}
      providers: ${{ steps.matrix.outputs.providers }}
    steps:
      - name: Resolve requested mode and providers
        id: matrix
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          REQUESTED_MODE: ${{ inputs.mode }}
          REQUESTED_PROVIDER: ${{ inputs.provider }}
          SCHEDULE_MODE: ${{ vars.NIB_LIVE_SCHEDULE_MODE || 'catalog' }}
        run: |
          set -euo pipefail

          all_providers='["openai","anthropic","google","grok","meta","openrouter"]'
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            mode="$REQUESTED_MODE"
            provider="$REQUESTED_PROVIDER"
          else
            mode="$SCHEDULE_MODE"
            provider="all"
            case "$mode" in
              catalog | selected) ;;
              *) echo "Scheduled qualification mode must be catalog or selected" >&2; exit 1 ;;
            esac
          fi

          case "$mode" in
            catalog | canary | selected | full) ;;
            *) echo "Unsupported live qualification mode" >&2; exit 1 ;;
          esac

          case "$provider" in
            all) providers="$all_providers" ;;
            openai | anthropic | google | grok | meta | openrouter)
              providers="[\"$provider\"]"
              ;;
            *) echo "Unsupported live qualification provider" >&2; exit 1 ;;
          esac

          {
            echo "mode=$mode"
            echo "providers=$providers"
          } >> "$GITHUB_OUTPUT"

  qualify:
    name: ${{ matrix.provider }} / ${{ needs.prepare.outputs.mode }}
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    environment:
      name: llm-live-${{ matrix.provider }}
    concurrency:
      group: llm-live-${{ matrix.provider }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        provider: ${{ fromJSON(needs.prepare.outputs.providers) }}
    env:
      NIB_LIVE_TESTS: "1"
      NIB_LIVE_ACK_COSTS: ${{ needs.prepare.outputs.mode == 'catalog' && '0' || '1' }}
      NIB_LIVE_PROVIDER: ${{ matrix.provider }}
      NIB_LIVE_RESULTS_DIR: target/llm-live/${{ matrix.provider }}
      NIB_LIVE_ALLOW_UNPRICED: ${{ vars.NIB_LIVE_ALLOW_UNPRICED || '0' }}
      NIB_LIVE_MAX_REQUESTS: ${{ needs.prepare.outputs.mode == 'catalog' && '10000' || vars.NIB_LIVE_MAX_REQUESTS }}
      NIB_LIVE_MAX_ATTEMPTS: ${{ needs.prepare.outputs.mode == 'catalog' && '30000' || vars.NIB_LIVE_MAX_ATTEMPTS }}
      NIB_LIVE_MAX_OUTPUT_TOKENS: ${{ needs.prepare.outputs.mode == 'catalog' && '64' || vars.NIB_LIVE_MAX_OUTPUT_TOKENS }}
      NIB_LIVE_MAX_TOTAL_OUTPUT_TOKENS: ${{ needs.prepare.outputs.mode == 'catalog' && '640000' || vars.NIB_LIVE_MAX_TOTAL_OUTPUT_TOKENS }}
      NIB_LIVE_MAX_ACTUAL_COST_USD: ${{ needs.prepare.outputs.mode == 'catalog' && '100' || vars.NIB_LIVE_MAX_ACTUAL_COST_USD }}
      NIB_LIVE_CONCURRENCY: ${{ needs.prepare.outputs.mode == 'catalog' && '1' || vars.NIB_LIVE_CONCURRENCY }}
      NIB_LIVE_SCENARIO_TIMEOUT_SECS: ${{ needs.prepare.outputs.mode == 'catalog' && '120' || vars.NIB_LIVE_SCENARIO_TIMEOUT_SECS }}
      NIB_LIVE_PROVIDER_TIMEOUT_SECS: ${{ needs.prepare.outputs.mode == 'catalog' && '3600' || vars.NIB_LIVE_PROVIDER_TIMEOUT_SECS }}
      NIB_LIVE_RUN_TIMEOUT_SECS: ${{ needs.prepare.outputs.mode == 'catalog' && '14400' || vars.NIB_LIVE_RUN_TIMEOUT_SECS }}
      RUST_LOG: warn
      RUST_LOG_STYLE: never
      RUST_BACKTRACE: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable

      - name: Install Task
        uses: arduino/setup-task@b91d5d2c96a56797b48ac1e0e89220bf64044611 # v2
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run live qualification
        shell: bash
        env:
          PROVIDER_API_KEY: ${{ secrets.LLM_API_KEY }}
          META_BASE_URL: ${{ secrets.NIB_LIVE_META_BASE_URL }}
        run: |
          set -euo pipefail
          if [ "${{ needs.prepare.outputs.mode }}" != "catalog" ]; then
            for required_limit in \
              NIB_LIVE_MAX_REQUESTS \
              NIB_LIVE_MAX_ATTEMPTS \
              NIB_LIVE_MAX_OUTPUT_TOKENS \
              NIB_LIVE_MAX_TOTAL_OUTPUT_TOKENS \
              NIB_LIVE_MAX_ACTUAL_COST_USD \
              NIB_LIVE_CONCURRENCY \
              NIB_LIVE_SCENARIO_TIMEOUT_SECS \
              NIB_LIVE_PROVIDER_TIMEOUT_SECS \
              NIB_LIVE_RUN_TIMEOUT_SECS
            do
              test -n "${!required_limit:-}" || {
                echo "Protected paid qualification requires reviewed provider-scoped $required_limit." >&2
                exit 1
              }
            done
          fi
          case "$NIB_LIVE_PROVIDER" in
            openai) export OPENAI_API_KEY="$PROVIDER_API_KEY" ;;
            anthropic) export ANTHROPIC_API_KEY="$PROVIDER_API_KEY" ;;
            google) export GOOGLE_API_KEY="$PROVIDER_API_KEY" ;;
            grok) export XAI_API_KEY="$PROVIDER_API_KEY" ;;
            meta)
              export META_API_KEY="$PROVIDER_API_KEY"
              export NIB_LIVE_META_BASE_URL="$META_BASE_URL"
              ;;
            openrouter) export OPENROUTER_API_KEY="$PROVIDER_API_KEY" ;;
            *) echo "Unsupported provider" >&2; exit 1 ;;
          esac
          unset PROVIDER_API_KEY META_BASE_URL
          task test:llm-live:${{ needs.prepare.outputs.mode }}

      - name: Verify sanitized reports exist
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          test "$(find "$NIB_LIVE_RESULTS_DIR" -maxdepth 1 -type f -name '*.json' | wc -l)" -ge 1
          test "$(find "$NIB_LIVE_RESULTS_DIR" -maxdepth 1 -type f -name '*.md' | wc -l)" -ge 1

      - name: Upload sanitized live reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: llm-live-${{ matrix.provider }}-${{ needs.prepare.outputs.mode }}-${{ github.run_attempt }}
          path: ${{ env.NIB_LIVE_RESULTS_DIR }}
          if-no-files-found: ignore
          retention-days: 7

  aggregate:
    name: Aggregate live qualification
    if: always()
    needs:
      - prepare
      - qualify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download provider reports
        if: needs.qualify.result != 'skipped'
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: llm-live-*-${{ needs.prepare.outputs.mode }}-${{ github.run_attempt }}
          path: llm-live-results
          merge-multiple: false

      - name: Publish aggregate summary and enforce result
        shell: bash
        env:
          MODE: ${{ needs.prepare.outputs.mode }}
          PROVIDERS: ${{ needs.prepare.outputs.providers }}
          PREPARE_RESULT: ${{ needs.prepare.result }}
          QUALIFY_RESULT: ${{ needs.qualify.result }}
          SOURCE_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail

          {
            echo "## Live LLM qualification"
            echo
            echo "- Mode: \`${MODE:-unresolved}\`"
            echo "- Providers: \`${PROVIDERS:-unresolved}\`"
            echo "- Prepare job: \`$PREPARE_RESULT\`"
            echo "- Provider matrix: \`$QUALIFY_RESULT\`"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$PREPARE_RESULT" != "success" ] || [ "$QUALIFY_RESULT" != "success" ]; then
            echo "One or more provider qualifications were missing, blocked, or failed." >&2
            exit 1
          fi

          expected_count="$(jq 'length' <<<"$PROVIDERS")"
          mapfile -t reports < <(find llm-live-results -type f -name '*.json' | sort)
          if [ "${#reports[@]}" -ne "$expected_count" ]; then
            echo "Expected $expected_count provider reports, found ${#reports[@]}." >&2
            exit 1
          fi

          expected_providers="$(jq -c 'sort' <<<"$PROVIDERS")"
          actual_providers="$(jq -s -c '[.[].providers[0].provider] | sort' "${reports[@]}")"
          if [ "$actual_providers" != "$expected_providers" ]; then
            echo "Provider reports do not match the requested provider set." >&2
            exit 1
          fi

          unique_run_count="$(jq -r '.run_id' "${reports[@]}" | sort -u | wc -l)"
          if [ "$unique_run_count" -ne "$expected_count" ]; then
            echo "Provider reports do not have unique run identities." >&2
            exit 1
          fi
          for report in "${reports[@]}"; do
            jq -e --arg mode "$MODE" --arg revision "$SOURCE_REVISION" '
              .schema_version == 2 and
              .source_revision == $revision and
              .mode == $mode and
              .complete == true and
              .passed == true and
              (.providers | length) == 1 and
              .providers[0].complete == true and
              .providers[0].passed == true and
              (if $mode == "selected" then
                (.selected_suite.suite_id | length) > 0 and
                (.selected_suite.matrix_sha256 | test("^[0-9a-f]{64}$")) and
                .selected_suite.required_task_count >= 3 and
                (.providers[0].profiles | length) > 0 and
                all(.providers[0].profiles[];
                  .classification == "qualified" and
                  all(.scenarios[]; .passed == true) and
                  (([.scenarios[].scenario] | length) ==
                    ([.scenarios[].scenario] | unique | length)) and
                  (([.not_applicable_scenarios[]] | length) ==
                    ([.not_applicable_scenarios[]] | unique | length)) and
                  ([.scenarios[] |
                    select(.scenario == "complete_text" and .passed == true)] |
                    length) == 1 and
                  ([.scenarios[] |
                    select(.scenario == "streamed_text" and .passed == true)] |
                    length) == 1 and
                  ([.scenarios[] |
                    select(.scenario == "single_tool_continuation" and .passed == true)] |
                    length) == 1 and
                  (([.scenarios[] |
                    select(.scenario == "parallel_tool_continuation" and .passed == true)] |
                    length) +
                    ([.not_applicable_scenarios[] |
                      select(. == "parallel_tool_continuation")] | length)) == 1
                )
              else
                .selected_suite == null
              end)
            ' "$report" >/dev/null
          done

          if [ "$MODE" = "selected" ]; then
            mapfile -t suites < <(jq -S -c '.selected_suite' "${reports[@]}" | sort -u)
            if [ "${#suites[@]}" -ne 1 ]; then
              echo "Selected provider reports do not share identical suite provenance." >&2
              exit 1
            fi
            matrix_hash="$(jq -r '.selected_suite.matrix_sha256' "${reports[0]}")"
            {
              echo
              echo "- Suite: \`$(jq -r '.selected_suite.suite_id' "${reports[0]}")\`"
              echo "- Matrix SHA-256: \`$matrix_hash\`"
              for report in "${reports[@]}"; do
                provider="$(jq -r '.providers[0].provider' "$report")"
                echo
                echo "### $provider"
                jq -r '
                  .providers[0].profiles[] |
                  "- `\(.model_ref)` / `\(.transport)`: " +
                  (([.scenarios[] | "`\(.scenario)=\(.passed)`"] +
                    [.not_applicable_scenarios[] | "`\(.)=not_applicable`"]) | join(", "))
                ' "$report"
              done
            } >> "$GITHUB_STEP_SUMMARY"
          fi
