[package]
name = "nib"
version = "0.1.0"
edition = "2021"
description = "Local-first AI coding agent with persistent plans, gated tools, and auditable execution."
license = "MIT"
authors = ["nib Contributors"]
repository = "https://github.com/skills-yaml/nib"

[lib]
name = "nib"
path = "src/lib.rs"

[[bin]]
name = "nib"
path = "src/main.rs"

[dependencies]
aho-corasick = "1"
async-trait = "0.1"
cap-std = "4.0"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.4", features = ["derive"] }
colored = "2.1"
crossterm = "0.28"
ratatui = "0.29"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
futures = "0.3"
futures-util = "0.3"
jsonschema = { version = "=0.33.0", default-features = false }
libc = "0.2"
rpassword = "7.3"
same-file = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip"] }
serde_yaml = "0.9"
sha2 = "0.10"
thiserror = "2.0"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "process", "time", "io-util", "io-std", "fs"] }
tempfile = "3.8"
toml = "0.8"
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
eventsource-stream = "0.2.3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[dev-dependencies]
serial_test = "3.0"

[build-dependencies]
