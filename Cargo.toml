[package]
name = "nib"
version = "0.1.0"
edition = "2021"
description = "AI agent for coding and workload management. Persistent backlog owner with disciplined execution."
license = "MIT"
authors = ["nib Contributors"]
repository = "https://github.com/example/nib"  # update as needed

[lib]
name = "nib"
path = "src/lib.rs"

[[bin]]
name = "nib"
path = "src/main.rs"

[dependencies]
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.4", features = ["derive"] }
colored = "2.1"
crossterm = "0.28"
ratatui = "0.29"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rpassword = "7.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "process", "time", "io-util", "io-std", "fs"] }
tempfile = "3.8"
toml = "0.8"
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
serial_test = "3.0"

[build-dependencies]
