version: '3'

# nib - Task runner (Rust CLI + core).
# All checks, tests, and builds go through these tasks.

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list

  check:
    desc: Run Rust formatting, lint, compile, and unit tests
    cmds:
      - task: installers:check
      - cargo fmt -- --check
      - cargo clippy -- -D warnings
      - cargo check
      - cargo test -- --test-threads=1

  check:all-targets:
    desc: Type-check every Rust target and feature (supports cross TARGET)
    cmds:
      - cargo check --all-targets --all-features {{if .TARGET}}--target {{.TARGET}}{{end}}

  fmt:
    desc: Format Rust source
    cmds:
      - cargo fmt

  docs:check:
    desc: Validate internal Markdown links and spec-state invariants
    cmds:
      - cargo test --test docs_integrity -- --test-threads=1

  installers:check:
    desc: Validate installer syntax and pinned release defaults
    cmds:
      - sh -n scripts/install.sh
      - sh -n scripts/first-time-setup.sh
      - bash -n scripts/publish-release.sh
      - bash -n scripts/qualify-release-update.sh
      - bash -n scripts/check-managed-process-release.sh
      - grep -Fq 'skills-yaml/nib' scripts/install.sh
      - grep -Fq 'skills-yaml/nib' scripts/install.ps1
      - grep -Fq 'sha256' scripts/install.sh
      - grep -Fiq 'sha256' scripts/install.ps1

  coverage:
    desc: Enforce at least 80 percent line coverage on runtime components
    cmds:
      - scripts/check-runtime-coverage.sh

  fix:
    desc: Auto-format and apply clippy fixes
    cmds:
      - cargo fmt
      - cargo clippy --fix --allow-dirty --allow-no-vcs

  test:
    desc: Run unit and integration tests
    cmds:
      - cargo test -- --test-threads=1

  test:durable:
    desc: Run durable background task and scheduled worker integration tests
    cmds:
      - cargo test --test durable_tasks -- --test-threads=1

  test:managed-process-capability:
    desc: Verify the exact managed-process backend probe independently
    cmds:
      - cargo test --test managed_process_capability -- --test-threads=1

  test:updater:
    desc: Run self-update and update-notification unit tests
    cmds:
      - cargo test --bin nib updater::tests -- --test-threads=1
      - cargo test --test updater -- --test-threads=1

  qualify:release-update:unix:
    desc: Qualify a published development self-update on a native Unix runner
    platforms: [linux, darwin]
    requires:
      vars: [BOOTSTRAP_ARCHIVE, BOOTSTRAP_COMMIT, CANDIDATE_COMMIT, CANDIDATE_VERSION]
    cmds:
      - >-
        scripts/qualify-release-update.sh
        "{{.BOOTSTRAP_ARCHIVE}}"
        "{{.BOOTSTRAP_COMMIT}}"
        "{{.CANDIDATE_COMMIT}}"
        "{{.CANDIDATE_VERSION}}"

  qualify:release-update:windows:
    desc: Qualify a published development self-update on a native Windows runner
    platforms: [windows]
    requires:
      vars: [BOOTSTRAP_ARCHIVE, BOOTSTRAP_COMMIT, CANDIDATE_COMMIT, CANDIDATE_VERSION]
    cmds:
      - >-
        pwsh -NoLogo -NoProfile -File scripts/qualify-release-update.ps1
        -BootstrapArchive "{{.BOOTSTRAP_ARCHIVE}}"
        -BootstrapCommit "{{.BOOTSTRAP_COMMIT}}"
        -CandidateCommit "{{.CANDIDATE_COMMIT}}"
        -ExpectedCandidateVersion "{{.CANDIDATE_VERSION}}"

  test:windows-pseudoterminal:
    desc: Prove the inbox headless Windows console qualification host
    platforms: [windows]
    cmds:
      - pwsh -NoLogo -NoProfile -File scripts/test-windows-pseudoterminal.ps1

  test:installers:
    desc: Run installer and release-transaction integration tests
    cmds:
      - cargo test --test installers -- --test-threads=1

  build:
    desc: Build optimized release binary (supports cross TARGET)
    cmds:
      - cargo build --locked --release {{if .TARGET}}--target {{.TARGET}}{{end}}

  smoke:managed-process:
    desc: Kill the release-binary owner and verify supervised descendant cleanup
    cmds:
      - task: build
      - scripts/check-managed-process-release.sh

  dev:
    desc: Quick dev check (Rust-only core)
    cmds:
      - task: check
      - task: test
      - task: build
      - ./target/release/nib --help || cargo run -- --help

  clean:
    desc: Clean build artifacts
    cmds:
      - cargo clean
      - find . -type d -name '__pycache__' -exec rm -rf {} + || true
      - rm -rf .venv uv.lock || true
