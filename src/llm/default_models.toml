schema_version = 1

# General OpenAI 5.6+ models, latest three Grok releases, selected Gemini Flash.
# Preserve the existing default and suggestions first; append available alternatives.
# Other families retain the latest major generation; omit duplicate aliases/batch variants.

[providers.openai]
default_model = "gpt-6.1-sol"
models = [
  "gpt-6.1-sol",
  "gpt-6-astra",
  "gpt-6-luna",
  "gpt-6-sol",
  "gpt-5.6-sol",
  "gpt-5.6-terra",
  "gpt-5.6-luna",
]
